services:
  db:
    image: postgres:18
    container_name: dental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      # 127.0.0.1 means only this computer can reach the database
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep their data under this path
      - dental_postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  dental_postgres_data:
