services:
  db:
    image: postgres:18
    container_name: dental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      # 127.0.0.1 means only this computer can reach the database
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep their data under this path
      - dental_postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  # Catches every email the API sends in development, so nothing reaches a real inbox.
  # Read them at http://localhost:8025. Start just this one: docker compose up -d mailpit
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: dental-mailpit
    restart: unless-stopped
    environment:
      # Fake mail only on this computer, so no login is needed to send or read.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:1025:1025" # SMTP: the API sends here
      - "127.0.0.1:8025:8025" # web page to read what was "sent"

volumes:
  dental_postgres_data:
